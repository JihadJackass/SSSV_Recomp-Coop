# SSSV Co-op manifest.

[manifest]
id = "sssv_coop"
version = "1.2.3"
display_name = "SSSV Co-op"
description = """
Two-player online co-op for Space Station Silicon Valley. Each player runs \
their own copy of the game; when both are in the same level, the other \
player appears in your world as their currently possessed animal, synced in \
real time. Possession-aware (their ghost changes species when they take a \
new animal, and vanishes while they are the EVO soul), safe with level \
objectives (ghosts use a free animal slot, never existing animals), and \
self-healing over LAN, Radmin VPN, or any IP network. One player hosts, the \
other joins with the host's IP; both settings live in this Configure menu. \
The host's firewall must allow inbound UDP on the chosen port."""
short_description = "Two-player online co-op: see each other in the same level, LAN or Radmin."
authors = [ "JihadiJackassStudios" ]

game_id = "sssv"
minimum_recomp_version = "0.1.2"

dependencies = [ ]
optional_dependencies = [ ]

native_libraries = [
    { name = "sssv_coop_native", funcs = ["SSSVCoop_Update", "SSSVCoop_Debug", "SSSVCoop_GhostStatus", "SSSVCoop_IkReport"] }
]

[inputs]
elf_path = "build/mod.elf"
mod_filename = "sssv_coop"

func_reference_syms_file = "syms/sssv.us.syms.toml"
data_reference_syms_files = [ "syms/sssv.us.datasyms.toml" ]

additional_files = [ ]

# ---------------------------------------------------------------------------
# Configure menu
# ---------------------------------------------------------------------------

[[manifest.config_options]]
id = "debug_logging"
name = "Debug logging"
description = "Writes detailed animation-sync diagnostics to coop_log.txt. Leave Off for normal play."
type = "Enum"
options = [ "Off", "On" ]
default = "Off"

[[manifest.config_options]]
id = "mode"
name = "Mode"
description = "Off disables networking entirely. One player picks Host, the other picks Join."
type = "Enum"
options = [ "Off", "Host", "Join" ]
default = "Off"

[[manifest.config_options]]
id = "host_ip"
name = "Host IP address"
description = "Join mode only: the host machine's IP. LAN example: 192.168.1.50. With Radmin VPN, use the host's Radmin IP (usually 26.x.x.x)."
type = "String"
default = "192.168.1.50"

[[manifest.config_options]]
id = "port"
name = "UDP port"
description = "Must match on both machines. The host's firewall must allow inbound UDP on this port."
type = "Number"
min = 1024
max = 65535
step = 1
precision = 0
percent = false
default = 7642
